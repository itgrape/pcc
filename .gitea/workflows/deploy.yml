name: Build and deploy PCC

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pcc-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: host
    env:
      PCC_DEPLOY_NAME: ${{ vars.PCC_DEPLOY_NAME }}
      PCC_DB_DSN: ${{ secrets.PCC_DB_DSN }}
      PCC_ADMIN_USERNAME: ${{ secrets.PCC_ADMIN_USERNAME }}
      PCC_ADMIN_PASSWORD: ${{ secrets.PCC_ADMIN_PASSWORD }}
      PCC_COOKIE_SECURE: ${{ vars.PCC_COOKIE_SECURE }}
      PCC_SNOWFLAKE_NODE_ID: ${{ vars.PCC_SNOWFLAKE_NODE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Podman
        run: podman version

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${PCC_DB_DSN:?请配置 Gitea Secret: PCC_DB_DSN}"
          : "${PCC_ADMIN_USERNAME:?请配置 Gitea Secret: PCC_ADMIN_USERNAME}"
          : "${PCC_ADMIN_PASSWORD:?请配置 Gitea Secret: PCC_ADMIN_PASSWORD}"
          if (( ${#PCC_ADMIN_PASSWORD} < 16 )); then echo "PCC_ADMIN_PASSWORD 至少需要 16 个字符" >&2; exit 1; fi
          if [[ -n "${PCC_COOKIE_SECURE}" && "${PCC_COOKIE_SECURE}" != "true" && "${PCC_COOKIE_SECURE}" != "false" ]]; then
            echo "PCC_COOKIE_SECURE 只能是 true 或 false" >&2
            exit 1
          fi
          podman network exists internal || {
            echo "Podman 网络 internal 不存在" >&2
            exit 1
          }

      - name: Build and deploy
        shell: bash
        run: |
          set -euo pipefail

          image_name="${PCC_DEPLOY_NAME:-pcc}"
          container_name="${PCC_DEPLOY_NAME:-pcc}"

          # 将当前 latest 标记为 rollback
          podman rmi "${image_name}:rollback" >/dev/null 2>&1 || true
          if podman image exists "${image_name}:latest"; then
            podman tag "${image_name}:latest" "${image_name}:rollback"
          fi

          # 构建新镜像
          podman build \
            --file Containerfile \
            --tag "${image_name}:latest" \
            .

          # 宿主机映射端口（避免冲突用大端口）
          host_port_admin=18080
          host_port_server=18081

          # 停旧容器，启新容器
          podman rm --force "${container_name}" >/dev/null 2>&1 || true
          podman run \
            --detach \
            --name "${container_name}" \
            --restart unless-stopped \
            --network internal \
            -p "${host_port_admin}:8080" \
            -p "${host_port_server}:8081" \
            --env PCC_DB_DSN \
            --env PCC_ADMIN_USERNAME \
            --env PCC_ADMIN_PASSWORD \
            --env PCC_COOKIE_SECURE \
            --env PCC_SNOWFLAKE_NODE_ID \
            "${image_name}:latest"

          # 健康检查（用宿主机 curl，distroless 里没有 shell/wget）
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:${host_port_admin}/healthz" >/dev/null 2>&1 && \
               curl -sf "http://127.0.0.1:${host_port_server}/healthz" >/dev/null 2>&1; then
              echo "部署成功：${container_name}:8080（管理端），${container_name}:8081（服务端）"
              exit 0
            fi
            if [[ "$(podman inspect --format '{{.State.Running}}' "${container_name}" 2>/dev/null || true)" != "true" ]]; then
              echo "容器已退出" >&2
              podman logs "${container_name}" >&2 || true
              break
            fi
            sleep 2
          done

          # 健康检查失败 → 回滚
          echo "新版本健康检查失败" >&2
          podman rm --force "${container_name}" >/dev/null 2>&1 || true

          if podman image exists "${image_name}:rollback"; then
            echo "正在回滚到上一版本" >&2
            podman run \
              --detach \
              --name "${container_name}" \
              --restart unless-stopped \
              --network internal \
              -p "${host_port_admin}:8080" \
              -p "${host_port_server}:8081" \
              --env PCC_DB_DSN \
              --env PCC_ADMIN_USERNAME \
              --env PCC_ADMIN_PASSWORD \
              --env PCC_COOKIE_SECURE \
              --env PCC_SNOWFLAKE_NODE_ID \
              "${image_name}:rollback"
            echo "已回滚到上一版本"
          else
            echo "不存在可回滚镜像" >&2
          fi
          exit 1

      - name: Clean old images
        if: always()
        shell: bash
        run: |
          image_name="${PCC_DEPLOY_NAME:-pcc}"
          podman image prune --force >/dev/null
          podman images --filter "reference=${image_name}:*" --format '{{.Repository}}:{{.Tag}}' |
          while read -r image; do
            case "${image}" in
              "${image_name}:latest"|"${image_name}:rollback") ;;
              *) podman rmi "${image}" >/dev/null 2>&1 || true ;;
            esac
          done
